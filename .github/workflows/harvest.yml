name: harvest-eta
on:
  schedule:
    # Aspirational only. Measured over 200 runs (2026-07-19 → 08-02), GitHub actually fires this
    # 13–17 times a day on a free public repo, i.e. roughly every 100 minutes. That is why the job
    # LOOPS internally rather than doing one cycle and exiting — see gh_cycle.py.
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: harvest
  # A fresh trigger should replace a stale long-running loop, not queue behind it. Safe because
  # gh_cycle.py checkpoints state to the release asset after EVERY cycle, so a cancelled run
  # loses at most the cycle in flight.
  cancel-in-progress: true
jobs:
  cycle:
    runs-on: ubuntu-latest
    # GitHub's job cap is 6 h; the old 8-minute limit was self-imposed and capped coverage at ~3%
    # of wall-clock. 55 gives the 50-minute loop headroom to finish and publish.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harvest cycles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for `gh release upload` of the state asset
          # Must comfortably finish BEFORE the next trigger cancels this run, or the publish step at the
          # end of the job is never reached and segment_times.json would go stale for ever. Observed
          # trigger gaps are 61-75 min, so 40 leaves real margin. (State itself is safe either way — it
          # is checkpointed to the release asset after every cycle.)
          LOOP_MINUTES: "40"
          CYCLE_EVERY_S: "600"                    # never poll faster than the cron always intended
          PUBLISH_EVERY_H: "12"
        run: python gh_cycle.py
      # KEEPS THE SCHEDULE ALIVE, as a side effect of doing real work.
      #
      # GitHub's docs: "In a public repository, scheduled workflows are automatically disabled when no
      # repository activity has occurred in 60 days." GitHub never defines "activity", and the commit
      # below is the only thing here that plausibly resets that clock -- but it is CONDITIONAL: it is
      # skipped both when the 12-hour publish window has not elapsed and when the content is unchanged.
      # A long enough quiet stretch with no human push would therefore disable the workflow silently.
      #
      # Traffic medians move constantly so a 60-day freeze is implausible in practice, and this is NOT
      # defended with a dummy-commit keepalive: that is the exact pattern GitHub has enforced against
      # (the most popular keepalive action is ToS-blocked). Instead the freshness of this file is
      # visible on the repo home page, and `workflow_dispatch` remains available to restart it by hand.
      - name: Publish segment_times.json
        run: |
          git config user.name "departly-eta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add segment_times.json
          if git diff --cached --quiet; then echo "not due for publish — nothing to commit"; exit 0; fi
          git commit -m "eta publish $(date -u +%FT%TZ)"
          git pull --rebase --autostash origin main || true
          git push
